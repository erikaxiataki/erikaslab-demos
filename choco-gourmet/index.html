<style>
:root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mut:#8e8e93;--sep:#e5e5ea;--blue:#007aff;--green:#34c759;--org:#ff9500;--red:#ff3b30;--fill:#e9e9ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--mut:#98989f;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--org:#ff9f0a;--red:#ff453a;--fill:#2c2c2e}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--mut:#98989f;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--org:#ff9f0a;--red:#ff453a;--fill:#2c2c2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
#app{width:100%;max-width:480px;min-height:100vh;padding:12px 16px 100px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;margin:6px 0 14px}
h1{font-size:34px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.4px}
.sub{color:var(--mut);font-size:13px}.c{text-align:center}
.hr{display:flex;gap:8px;align-items:center}
.gb{background:var(--fill);color:var(--blue);border:0;border-radius:16px;padding:6px 12px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer}
.pb{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-family:inherit;font-weight:600;font-size:16px;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.pb.round{width:32px;height:32px;border-radius:16px;padding:0;font-size:22px;line-height:1}
.pb.sm{padding:6px 10px;font-size:12px;border-radius:12px;white-space:nowrap}
.wide{display:block;width:100%;margin:10px 0}
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin:0 0 18px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:.5px solid var(--sep);cursor:pointer;color:inherit;text-decoration:none}.li:first-child{border-top:0}
.gr{flex:1;min-width:0}.gh{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin:0 0 6px 14px}
.chev{color:var(--mut);font-size:22px}
.ico{width:36px;height:36px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#a2845e,#6f4e37);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.chips,.rt{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.chip{font-size:11px;border-radius:10px;padding:2px 8px;background:var(--fill);color:var(--mut);white-space:nowrap}.chip.g{background:rgba(52,199,89,.16);color:var(--green)}.chip.o{background:rgba(255,149,0,.16);color:var(--org)}
.red{color:var(--red)}.big{font-size:28px;font-weight:700}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:0 0 16px}.seg button{flex:1;border:0;background:none;color:var(--ink);padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.flt{display:flex;gap:8px;margin-bottom:12px}
select,input,textarea{width:100%;padding:11px 12px;border:0;border-radius:10px;background:var(--fill);color:var(--ink);font:inherit;margin-bottom:8px;-webkit-appearance:none;appearance:none}
textarea{min-height:80px}
.days{display:flex;gap:6px;margin-bottom:14px}.days button{flex:1;border:0;background:var(--card);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;color:var(--ink);font-family:inherit;cursor:pointer}.days span{font-size:11px;color:var(--mut)}.days button.on{background:var(--blue);color:#fff}.days button.on span{color:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.tile{background:var(--card);border-radius:12px;padding:12px}.tile b{display:block;font-size:24px;font-weight:700}
.pad{padding:14px}
.bars{display:flex;gap:6px;align-items:flex-end;height:140px}.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mut);gap:3px}.bc i{display:block;width:100%;background:var(--blue);border-radius:5px 5px 0 0;min-height:2px}.bv{color:var(--ink)}
#tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:var(--card);border-top:.5px solid var(--sep);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
#tabs button{flex:1;border:0;background:none;color:var(--mut);font-size:10px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}#tabs button span{font-size:22px;filter:grayscale(1);opacity:.7}#tabs button.on{color:var(--blue)}#tabs button.on span{filter:none;opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:8}#modal.show{display:flex}
#sheet{background:var(--bg);width:100%;max-width:480px;border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.sh{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:12px 12px 4px;position:sticky;top:0;background:var(--bg)}.sh b{text-align:center}.sh .gb{justify-self:end;grid-column:3}
.sb{padding:8px 16px 20px}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);border-radius:20px;padding:10px 18px;transition:transform .3s;z-index:9;font-size:14px;font-weight:600}#toast.show{transform:translate(-50%,0)}
#toast{max-width:420px;border-radius:16px;text-align:left;line-height:1.35;cursor:pointer}
input[type=checkbox]{width:22px;height:22px;padding:0;margin:0;-webkit-appearance:auto;appearance:auto;accent-color:var(--blue);flex:none}
.ed{margin:0;padding:8px 10px;flex:1;min-width:0}.ed.pr{width:84px;flex:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:10px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--fill);position:relative;flex:none;transition:.2s}.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}.sw.on{background:var(--green)}.sw.on i{left:20px}
@keyframes rot{to{transform:rotate(360deg)}}.spin{animation:rot .8s linear infinite;display:inline-block}
#pm{min-height:300px;line-height:1.45}
details{margin-bottom:12px}summary{font-weight:600;padding:8px 2px;cursor:pointer;font-size:15px}
.card2{background:var(--card);border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;cursor:pointer}.tm{font-weight:700;font-size:17px;min-width:48px}.nt{font-size:13px;margin-top:6px;background:var(--fill);border-radius:8px;padding:6px 8px;white-space:pre-wrap}.cta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chipb{font-size:12px;background:var(--fill);color:var(--blue);border-radius:12px;padding:5px 10px;text-decoration:none;border:0;font-family:inherit;cursor:pointer}
.demo{border:1.5px dashed var(--sep);border-radius:12px;padding:10px;margin-bottom:14px}.demo .wide{margin:0 0 6px}.li.fresh{animation:flash 1.8s ease}@keyframes flash{from{background:rgba(0,122,255,.28)}}
.msg .row2{display:flex;justify-content:space-between;gap:8px}.mb{white-space:pre-wrap;font-size:14px;margin:8px 0;max-height:220px;overflow:auto}.msg{margin-bottom:12px}

const brandBar=()=>CH()?`<div class="brandbar"><img src="${LOGO}" alt="Choco Gourmet"></div>`:'';
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return y+'-'+pad(mo)+'-'+pad(da)}
function seasons(){const y=new Date().getFullYear(),o=[];[y,y+1].forEach(Y=>{o.push(['val',Y+'-02-14'],['east',easter(Y)],['xmas',Y+'-12-25']);const d=new Date(Y,9,1);let n=0;while(true){if(d.getDay()===1&&++n===2)break;d.setDate(d.getDate()+1)}o.push(['than',ymd(d)])});return o.filter(x=>dd(x[1])>=0).sort((a,b)=>a[1]>b[1]?1:-1)}
function seasonBanner(){if(!CH())return'';const s=seasons()[0],n=dd(s[1]),k=S.d.filter(x=>x.sp&&x.st<3&&dd(x.dt)>=Math.max(0,n-14)&&dd(x.dt)<=n+1).length,ic={val:'💝',east:'🐣',than:'🍂',xmas:'🎄'}[s[0]],nm=t('sea_'+s[0]);
 return `<div class="season"><span style="font-size:22px">${ic}</span><div>${n===0?t('seasonToday',{s:nm}):'<b>'+t('seasonIn',{s:nm,n:n})+'</b>'}<div class="sub">${k} ${t('seasonSp')}</div></div></div>`}
function lastBuy(c){const ds=S.d.filter(x=>x.c===c.id&&x.st===3).map(x=>x.dt).sort();return ds.length?ds[ds.length-1]:null}
function reconSec(){if(!CH())return'';const L2=S.c.map(c=>({c,l:lastBuy(c)})).filter(x=>x.l&&dd(x.l)<-45&&!S.t.some(v=>!v.dn&&v.c===x.c.id)).sort((a,b)=>a.l>b.l?1:-1).slice(0,3);if(!L2.length)return'';
 return `<div class="gh">${t('reconnect')}</div><div class="grp">${L2.map(x=>`<div class="li" data-a="fu+" data-i="${x.c.id}"><span class="av">${ini(x.c.n)}</span><div class="gr"><b>${esc(x.c.n)}</b><div class="sub">${t('lastBuy',{n:-dd(x.l)})}</div></div><span class="pb sm">+ ${t('addFu')}</span></div>`).join('')}</div>`}
function prodSec(){if(!CH())return'';const L2=S.d.filter(x=>x.sp&&x.st===2).sort((a,b)=>a.dt>b.dt?1:-1);
 return `<button class="pb wide" data-a="sp0">🎂 ${t('spNew')}</button><div class="gh" style="margin-top:14px">${t('toMake')} · ${L2.length}</div><div class="grp g2">${L2.map(x=>{const c=cl(x.c),d=dd(x.dt);return `<div class="li" data-a="deal" data-i="${x.id}"><div class="dt"><b>${+x.dt.slice(8)}</b><span>${fd(x.dt,{month:'short'})}</span></div><div class="gr"><b>${esc(x.ti)}</b><div class="sub">${esc(c.n)}${x.qty?' · '+esc(x.qty):''}</div>${x.al?`<div class="sub red">⚠ ${esc(x.al)}</div>`:''}</div><div class="rt"><span class="chip ${d<=2?'o':''}">${dl(x.dt)}</span><span class="chip">${t('pk_'+(x.pk||'pickup'))}</span></div></div>`}).join('')||`<div class="li sub">-</div>`}</div><p class="sub c">${t('prodNote')}</p>`}
function spRows(x,r){const bal=Math.max(0,x.am-(x.dep||0));return r(t('occasion'),t('oc_'+(x.oc||'other')))+(x.it?r(t('spMake'),esc(x.it)):'')+(x.qty?r(t('qty'),esc(x.qty)):'')+r(t('pkL'),t('pk_'+(x.pk||'pickup')))+r(t('dep'),money(x.dep||0))+r(t('bal'),money(bal))+(x.al?r(t('diet'),'⚠ '+esc(x.al)):'')}
let spPk='pickup';
function spSheet(cid){spPk='pickup';const ocs=['birthday','wedding','corporate','holiday','baby','other'];
 sheet(t('spNew'),`<div class="gh">${t('client')}</div><select id="sc"><option value="">${t('chooseC')}</option>${S.c.map(c=>`<option value="${c.id}"${c.id===cid?' selected':''}>${esc(c.n)}</option>`).join('')}</select><div class="gh">${t('newCOpt')}</div><input id="sn" placeholder="${t('name')}"><input id="sph" type="tel" placeholder="${t('phone')}"><div class="gh">${t('source')}</div><select id="ssr">${opts(SRCL(),'sr_','market')}</select><div class="gh">${t('occasion')}</div><select id="so">${ocs.map(o=>`<option value="${o}">${t('oc_'+o)}</option>`).join('')}</select><div class="gh">${t('spMake')}</div><textarea id="si" placeholder="${t('spMakePh')}"></textarea><div class="gh">${t('qty')}</div><input id="sq" placeholder="${t('qtyPh')}"><div class="flt"><div style="flex:1"><div class="gh">${t('amount')}</div><input id="sa" type="number" inputmode="decimal"></div><div style="flex:1"><div class="gh">${t('dep')}</div><input id="sd" type="number" inputmode="decimal"></div></div><div class="flt"><div style="flex:1"><div class="gh">${t('dueDate')}</div><input id="sdt" type="date" value="${add(7)}"></div><div style="flex:1"><div class="gh">${t('time')}</div><input id="stm" type="time" value="10:00"></div></div><div class="gh">${t('pkL')}</div>${segc([['pickup',t('pk_pickup')],['delivery',t('pk_delivery')]],spPk,'spk')}<div class="gh">${t('diet')}</div><input id="sal" placeholder="${t('dietPh')}"><button class="pb wide" data-a="spsave">${t('save')}</button>`)}
function logSheet(cid){nf='3';const c=cl(cid);sheet(t('logC'),`<div class="grp"><div class="li" style="cursor:default"><span class="av">${ini(c.n)}</span><div class="gr"><b>${esc(c.n)}</b></div></div></div><div class="gh">${t('logVia')}</div><select id="lk">${['ig','fb','email','market','call'].map(k=>`<option value="${k}">${KI[k]} ${t('ch_'+k)}</option>`).join('')}</select><div class="gh">${t('whatSaid')}</div><textarea id="lt"></textarea><div class="gh">${t('nextFu')}</div>${segc([['0',t('none')],['3',t('d3')],['7',t('d7')]],nf,'nf')}<button class="pb wide" data-a="logsave" data-i="${cid}">${t('save')}</button>`)}
function bizSheet(){sheet(t('bizPick'),`<div class="grp">${Object.keys(BZ).map(k=>`<div class="li" data-a="bizset" data-i="${k}"><span class="ico">${BZ[k].emoji}</span><div class="gr"><b>${BZ[k].name}</b><div class="sub">${t('bz_'+k)}</div></div>${k===biz?'<span class="chip g">✓</span>':'<span class="chev">›</span>'}</div>`).join('')}</div>`)}
function switchBiz(k){if(k===biz){closeSheet();return}STATES[biz]=S;biz=k;if(!STATES[k]){S=seed();STATES[k]=S;L=BZ[k].lang}else S=STATES[k];norm();tab='today';seg='todo';fT='all';fS='all';plKey='';plMsg='';try{history.replaceState(null,'',k==='choco'?'#choco':'#')}catch(e){}closeSheet();render();window.scrollTo(0,0)}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,i=el.dataset.i;if(a==='noop')return;

 if(a==='biz'){bizSheet();return}
 if(a==='bizset'){switchBiz(i);return}
 if(a==='sp0'){spSheet();return}
 if(a==='sp+'){spSheet(i);return}
 if(a==='spk'){spPk=i;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));return}
 if(a==='spsave'){let cid=$('#sc').value;const nm=$('#sn').value.trim();if(nm){cid='c'+Date.now();S.c.push({id:cid,n:nm,o:'',ty:'individual',sr:$('#ssr').value,ph:$('#sph').value.trim(),em:'',cs:false,cr:add(0)})}if(!cid){toast(t('chooseC'));return}
  const oc=$('#so').value,it=$('#si').value.trim(),ti=(it.split('\n')[0]||t('oc_'+oc)).slice(0,50),dt=$('#sdt').value||add(7),id='d'+Date.now(),d=new Date();
  S.d.push({id,c:cid,ti,am:+$('#sa').value||0,st:2,dt,iv:'none',ad:'',sp:1,oc,it,qty:$('#sq').value.trim(),dep:+$('#sd').value||0,pk:spPk,al:$('#sal').value.trim()});
  S.t.push({id:'t'+Date.now(),c:cid,k:'text',du:add(Math.max(0,dd(dt)-2)),dn:null});
  if(spPk==='pickup')A().push({id:'a'+Date.now(),c:cid,k:'pickup',dt,tm:$('#stm').value||'10:00',nt:it});
  H().push({c:cid,k:'note',dt:add(0),tm:pad(d.getHours())+':'+pad(d.getMinutes()),tx:t('sp')+': '+ti});
  closeSheet();toast('✓ '+t('spSaved'));tab='orders';persist();window.scrollTo(0,0);return}
 if(a==='log+'){logSheet(i);return}
 if(a==='logsave'){const k=$('#lk').value,d=new Date();H().push({c:i,k,dt:add(0),tm:pad(d.getHours())+':'+pad(d.getMinutes()),tx:($('#lt').value.trim()||t('ch_'+k)).slice(0,90)});if(nf!=='0')S.t.push({id:'t'+Date.now(),c:i,k:k==='email'?'email':k==='call'?'call':'text',du:add(+nf),dn:null});closeSheet();toast('✓ '+t('logged'));persist();return}
 if(a==='pl'){plRet=i||'';plSheet();return}
 if(a==='pluse'){plEdit=false;plRet?(plRet[0]==='c'?sendPl(plRet):openTask(plRet)):closeSheet();return}
 if(a==='pedit'){plEdit=!plEdit;plSheet();return}
 if(a==='padd'){const n=$('#np').value.trim();if(!n)return;const id='p'+Date.now();prods().push({id,cat:$('#npc').value,en:n,fr:n,pr:+$('#npp').value||0});pl().push(id);persist();plSheet();return}
 if(a==='pdel'){S.p=prods().filter(x=>x.id!==i);S.pl=pl().filter(x=>x!==i);persist();plSheet();return}
 if(a==='sendpl'){plMsg='';plKey='';plCh='email';plRet=i;sendPl(i);return}
 if(a==='pch'){plCh=i;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));return}
 if(a==='plsend'){const body=$('#pm').value;S.t.push({id:'t'+Date.now(),c:i,k:plCh,du:add(0),dn:add(0)});S.t.push({id:'t'+(Date.now()+1),c:i,k:plCh,du:add(3),dn:null});plMsg='';plKey='';sentFlow(i,plCh,body,add(3));return}
 if(a==='plall'||a==='plclr'){S.pl=a==='plall'?prods().map(p=>p.id):[];persist();const il=$('#plinline');if(il){il.innerHTML=plChecks(il.querySelector('[data-a=pledit]').dataset.i);plRefresh()}else plSheet();return}
 if(a==='pledit'){plRet=i||'';plEdit=true;plSheet();return}
 
 if(a==='plus'){CH()?plusSheet():clientSheet();return}
 if(a==='addorder'){dealSheet(undefined,2);return}
 if(a==='addfu0'){fuSheet();return}
 if(a==='savefu'){S.t.push({id:'t'+Date.now(),c:$('#fc').value,k:$('#fk2').value,du:$('#fd2').value||add(1),dn:null});closeSheet();toast('✓ '+t('newFu'));persist();return}
 if(a==='plpick'){pickSheet();return}
 if(a==='addprod'){plEdit=true;plRet='';plSheet();return}
 if(a==='fu+'){fuSheet(i);return}
 if(a==='appt+'){apptSheet(i);return}
 if(a==='order+'){dealSheet(i,2);return}
 if(a==='appt'){openAppt(i);return}
 if(a==='saveappt'){A().push({id:'a'+Date.now(),c:$('#ac').value,k:$('#ak').value,dt:$('#ad1').value||add(1),tm:$('#at').value||'10:00',nt:$('#an').value.trim()});closeSheet();toast('✓ '+t('newAppt'));persist();return}
 if(a==='delappt'){S.a=A().filter(x=>x.id!==i);closeSheet();persist();return}
 if(a==='refresh'){refresh();return}
 if(a==='settings'){settingsSheet();return}
 if(a==='cn'&&PLN.includes(i)&&CH()){sheet(t('cn_'+i),`<p class="sub c" style="font-size:15px;margin:24px 0">${t('plannedNote')}</p><button class="pb wide" data-a="settings">${t('settings')}</button>`);return}
 if(a==='cn'){const k=CN();k[i]=!k[i];el.querySelector('.sw').classList.toggle('on',!!k[i]);persist();return}
 if(a==='pv'){const k=PV();k[i]=!k[i];el.querySelector('.sw').classList.toggle('on',!!k[i]);persist();return}
 if(a==='ccs'){const c=cl(i);c.cs=c.cs===false;el.querySelector('.sw').classList.toggle('on',c.cs);persist();return}
 if(a==='export'){toast('✓ '+t('exported'));return}
 if(a==='reply'){const x=S.t.find(v=>!v.dn&&v.c===i&&(v.k==='email'||v.k==='text'));if(x){plKey='';openTask(x.id)}else fuSheet(i);return}
 if(a==='apdone'){apOutcome(i);return}
 if(a==='apout'){const x=A().find(v=>v.id===i),d=new Date();x.done=true;H().push({c:x.c,k:x.k,dt:add(0),tm:pad(d.getHours())+':'+pad(d.getMinutes()),tx:($('#aout').value.trim()||t('apDone')).slice(0,80)});if(nf!=='0')S.t.push({id:'t'+Date.now(),c:x.c,k:'email',du:add(+nf),dn:null});closeSheet();toast('✓ '+t('apDone'));persist();return}
 if(a==='simenq'){try{simEnq()}catch(err){console.error(err);toast('Could not add the enquiry: '+err.message)}return}
 if(a==='lang'){L=L==='en'?'fr':'en';render();return}
 if(a==='tab'){tab=i;render();window.scrollTo(0,0);return}
 if(a==='seg'){seg=i;render();return}
 if(a==='cal'){cal=+i;render();return}
 if(a==='per'){per=i;render();return}
 if(a==='close'){closeSheet();return}
 if(a==='nf'){nf=i;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));return}
 if(a==='task'){plKey='';openTask(i);return}
 if(a==='deal'){openDeal(i);return}
 if(a==='client'){openClient(i);return}
 if(a==='adddeal'){dealSheet();return}
 if(a==='deal+'){dealSheet(i);return}
 if(a==='addclient'){clientSheet();return}
 if(a==='complete'){const body=$('#pm')?$('#pm').value:'';plKey='';plMsg='';const x=S.t.find(v=>v.id===i);x.dn=add(0);let nx='';if(nf!=='0'){S.t.push({id:'t'+Date.now(),c:x.c,k:x.k,du:add(+nf),dn:null});nx=add(+nf)}persist();sentFlow(x.c,x.k,body,nx);return}
 if(a==='inv'){S.d.find(v=>v.id===i).iv='sent';persist();openDeal(i);return}
 if(a==='paid'){S.d.find(v=>v.id===i).iv='paid';persist();openDeal(i);return}
 if(a==='deliver'){const x=S.d.find(v=>v.id===i);x.st=3;x.dt=add(0);persist();openDeal(i);return}
 if(a==='adv'){const x=S.d.find(v=>v.id===i);x.st=Math.min(3,x.st+1);if(x.st===2&&dd(x.dt)<0)x.dt=add(3);persist();toast(t('moved')+' '+t('st'+x.st));return}
 if(a==='addfu'){S.t.push({id:'t'+Date.now(),c:i,k:$('#fk').value,du:$('#fdt').value||add(1),dn:null});closeSheet();toast('✓ '+t('addFu'));persist();return}
 if(a==='savedeal'){S.d.push({id:'d'+Date.now(),c:$('#dc').value,ti:$('#dt1').value||t('newDeal'),am:+$('#da').value||0,st:+$('#ds').value,dt:$('#dd1').value||add(7),iv:'none',ad:'Charlottetown, PE'});closeSheet();persist();return}
 if(a==='saveclient'){const n=$('#cn').value.trim();if(!n){toast(t('name'));return}const id='c'+Date.now();S.c.push({id,n,o:$('#co').value.trim(),ty:$('#ct').value,sr:$('#cs').value,ph:$('#cp').value.trim(),em:$('#ce').value.trim(),ad:$('#ca').value.trim(),nt:$('#cnt').value.trim(),cs:false,cr:add(0)});persist();openClient(id);toast('✓ '+t('newClient'));return}
 if(a==='reset'){e.preventDefault();S=seed();norm();persist()}});
document.addEventListener('change',e=>{const a=e.target.dataset.a,i=e.target.dataset.i,v=e.target.value;
 if(e.target.id==='ph'){const f=e.target.files[0];if(f){const rd=new FileReader();rd.onload=()=>{(PH[curDeal]=PH[curDeal]||[]).push(rd.result);openDeal(curDeal)};rd.readAsDataURL(f)}return}
 if(a==='ant'){A().find(v=>v.id===i).nt=v;persist();return}if(a==='cig'){cl(i).ig=v.replace(/^@/,'');persist();return}if(a==='cph'){cl(i).ph=v;persist();return}if(a==='cem'){cl(i).em=v;persist();return}if(a==='cad'){cl(i).ad=v;persist();return}if(a==='cnt'){cl(i).nt=v;persist();return}
 if(a==='pnm'){prods().find(x=>x.id===i)[L]=v;persist();return}
 if(a==='ppr'){prods().find(x=>x.id===i).pr=+v||0;persist();return}
 if(a==='plck'){const l=pl(),k=l.indexOf(i);if(k>=0)l.splice(k,1);else l.push(i);persist();const pc=$('#plc');if(pc)pc.textContent=pl().length;plRefresh()}
 if(a==='fT'){fT=v;render()}if(a==='fS'){fS=v;render()}
 if(a==='cty'){cl(i).ty=v;persist()}if(a==='csr'){cl(i).sr=v;persist()}});
document.addEventListener('input',e=>{if(e.target.id==='pm')plMsg=e.target.value});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet()});
render();

</script>
</body>
</html>
